# Poll the flood forecast, build the site and publish it to GitHub Pages.
# FLOODWATCH_GAUGES is not set, so gauge readings are not read and the page contains no agency data.
# A failed request fails the run, so nothing is published from partial data.
name: Poll and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; GitHub may delay scheduled runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet requests certifi
      - name: Test
        run: |
          python3 tests_levels.py
          python3 tests_rivers.py
      - name: Poll
        run: python3 -m floodwatch poll
      - name: Build the site
        run: python3 deploy/build-site.py public
      - name: Refuse to publish agency data
        run: |
          if grep -q '"gauges": \[{' public/index.html; then
            echo "::error::gauge data found in the public page"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
