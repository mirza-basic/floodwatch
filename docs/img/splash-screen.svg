<?xml version="1.0" encoding="UTF-8"?>
<!-- FloodWatch loading screen: a rain cloud fading in above a curved horizon, rain falling on a river valley
     while a HUD reticle locks on and the river rises. Self-contained (no external assets): open it
     directly in a browser to preview it. floodwatch/mapgen.py reads this file and splices its <svg>...</svg>
     into the page's loading overlay (see _splash_svg() and the __SPLASH_SVG__ placeholder), so this is the
     only copy to edit. This comment and the XML prolog are removed before splicing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1200 0 3200 800" width="100%" height="100%"
  preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="flSpaceBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="flEarthGrad" cx="50%" cy="1400" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="75%" stop-color="#1E3A8A"/>
      <stop offset="98%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="flSolar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="flLand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="flWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <clipPath id="flDome"><path d="M -400,1400 A 800,800 0 0,1 1200,1400 Z"/></clipPath>
    <style>
      /* The first part (cloud, rising river, HUD) plays once over 3 s and holds its last frame.
         Only the small ambient loops (ripples, falling rain) repeat. Animated properties are limited to opacity
         and transform on small groups; the planet is static. */
      @keyframes flRise {
        0%, 35% { transform: scale(1); }
        55%, 100% { transform: scale(3.4); }
      }
      .fl-rise {
        animation: flRise 3s ease-out 1 forwards;
        transform-origin: 400px 640px;
      }
      @keyframes flFlood {
        0%, 12% { transform: scaleX(0.2); opacity: 0; }
        100% { transform: scaleX(1); opacity: 0.8; }
      }
      .fl-flood {
        animation: flFlood 2.8s ease-in-out 1 forwards;
        transform-origin: 400px 700px;
        opacity: 0;
      }
      @keyframes flFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      .fl-cloud {
        transform: translate(400px, 150px) scale(1.9);
        opacity: 0;
        animation: flFadeIn .6s ease-out .15s 1 forwards;
      }
      @keyframes flHud {
        0%, 55% { opacity: 0; transform: scale(0.6); }
        80%, 100% { opacity: 1; transform: scale(1); }
      }
      .fl-hud {
        animation: flHud 3s cubic-bezier(0.175, 0.885, 0.32, 1.2) 1 forwards;
        transform-origin: 400px 600px;
      }
      @keyframes flRipple {
        0% { transform: scale(0.3); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .fl-ripple-1 { animation: flRipple 1.8s ease-out infinite; transform-origin: 400px 618px; }
      .fl-ripple-2 { animation: flRipple 1.8s ease-out infinite .9s; transform-origin: 400px 618px; }
      @keyframes flRain {
        0% { opacity: 0; transform: translate(0, -30px); }
        20% { opacity: 0.55; }
        100% { opacity: 0; transform: translate(-12px, 60px); }
      }
      .fl-rain { opacity: 0; animation: flRain 0.9s linear infinite backwards; }
      .fl-rain-2 { animation-delay: .3s; }
      .fl-rain-3 { animation-delay: .6s; }
      @media (prefers-reduced-motion: reduce) {
        .fl-rise, .fl-flood, .fl-cloud, .fl-hud, .fl-ripple-1, .fl-ripple-2, .fl-rain { animation: none; }
        .fl-cloud, .fl-hud { opacity: 1; }
        .fl-flood { opacity: 0.8; }
      }
    </style>
  </defs>

  <rect x="-1200" width="3200" height="800" fill="url(#flSpaceBg)"/>

  <g>
    <!-- The planet: a fill that closes the bottom corners (same circle as the horizon arc below) and the arc itself. -->
    <path d="M 0,800 L 0,707.2 A 800,800 0 0,1 800,707.2 L 800,800 Z" fill="url(#flEarthGrad)"/>
    <path d="M -400,1400 A 800,800 0 0,1 1200,1400 Z" fill="url(#flEarthGrad)" stroke="#1D4ED8" stroke-width="2.5"/>

    <!-- A river valley on the planet, clipped to the planet's disc. -->
    <g clip-path="url(#flDome)">
      <ellipse cx="400" cy="745" rx="430" ry="128" fill="url(#flLand)"/>
      <ellipse cx="270" cy="652" rx="95" ry="18" fill="#065F46" opacity="0.7"/>
      <ellipse cx="545" cy="650" rx="100" ry="17" fill="#065F46" opacity="0.7"/>
      <!-- The river, widening toward the viewer. -->
      <path d="M 399,601 C 392,620 380,630 388,648 C 396,666 430,676 410,700 C 392,722 350,740 360,770 L 340,800 L 470,800 C 455,770 470,745 450,720 C 432,696 446,676 424,654 C 406,636 416,622 402,601 Z"
        fill="url(#flWater)" stroke="#BAE6FD" stroke-width="1.2" stroke-opacity="0.6"/>
      <!-- The river rising: a wider translucent copy of the river that grows out from its centre line. -->
      <path class="fl-flood" d="M 399,601 C 392,620 380,630 388,648 C 396,666 430,676 410,700 C 392,722 350,740 360,770 L 340,800 L 470,800 C 455,770 470,745 450,720 C 432,696 446,676 424,654 C 406,636 416,622 402,601 Z" fill="#38BDF8" fill-opacity="0.5" stroke="#7DD3FC" stroke-width="110" stroke-linejoin="round" stroke-opacity="0.35"/>
      <!-- Houses along the banks, lit. -->
      <g fill="#FBBF24" opacity="0.9">
        <rect x="334" y="652" width="7" height="5"/><rect x="348" y="644" width="6" height="5"/>
        <rect x="452" y="650" width="7" height="5"/><rect x="466" y="660" width="6" height="5"/>
        <rect x="318" y="684" width="8" height="6"/><rect x="486" y="692" width="8" height="6"/>
        <rect x="300" y="668" width="6" height="5"/><rect x="505" y="672" width="6" height="5"/>
      </g>
    </g>

    <!-- The rising water: a flood plain spreading around the river. Only this small group is scaled. -->
    <g class="fl-rise">
      <ellipse cx="400" cy="642" rx="70" ry="11" fill="#38BDF8" opacity="0.28"/>
      <ellipse cx="400" cy="642" rx="40" ry="6" fill="#7DD3FC" opacity="0.25"/>
    </g>
    <ellipse class="fl-ripple-1" cx="400" cy="618" rx="46" ry="8" fill="none" stroke="#7DD3FC" stroke-width="1.5"/>
    <ellipse class="fl-ripple-2" cx="400" cy="618" rx="46" ry="8" fill="none" stroke="#7DD3FC" stroke-width="1.5"/>
  </g>

  <!-- Rain falling from the cloud to the valley: streaks at scattered positions in three groups, out of step so the fall looks continuous. -->
  <g class="fl-rain fl-rain-1" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" fill="none"><path d="M 413,389 l -3,12 M 402,280 l -3,12 M 463,242 l -3,12 M 427,471 l -3,12 M 346,282 l -3,12 M 432,416 l -3,12 M 524,611 l -3,12 M 308,323 l -3,12 M 486,595 l -3,12 M 374,604 l -3,12 M 366,240 l -3,12 M 310,246 l -3,12 M 449,283 l -3,12 M 352,292 l -3,12 M 378,291 l -3,12 M 349,292 l -3,12 M 417,242 l -3,12 M 396,595 l -3,12 M 478,575 l -3,12 M 494,285 l -3,12 M 493,221 l -3,12 M 353,448 l -3,12 M 480,433 l -3,12 M 354,212 l -3,12 M 316,438 l -3,12 M 420,486 l -3,12 M 509,490 l -3,12 M 508,335 l -3,12 M 448,505 l -3,12 M 491,572 l -3,12 M 373,459 l -3,12 M 495,609 l -3,12 M 475,384 l -3,12 M 340,401 l -3,12 M 296,309 l -3,12 M 439,574 l -3,12 M 385,286 l -3,12 M 358,442 l -3,12 M 506,494 l -3,12 M 382,292 l -3,12 M 388,605 l -3,12 M 417,493 l -3,12 M 294,390 l -3,12 M 388,461 l -3,12 M 330,484 l -3,12 M 324,496 l -3,12 M 459,455 l -3,12 M 455,585 l -3,12 M 415,358 l -3,12 M 331,470 l -3,12"/></g>
  <g class="fl-rain fl-rain-2" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" fill="none"><path d="M 392,581 l -3,12 M 468,461 l -3,12 M 293,487 l -3,12 M 299,269 l -3,12 M 393,217 l -3,12 M 437,408 l -3,12 M 450,547 l -3,12 M 376,517 l -3,12 M 342,205 l -3,12 M 426,235 l -3,12 M 464,597 l -3,12 M 323,529 l -3,12 M 430,258 l -3,12 M 475,600 l -3,12 M 434,553 l -3,12 M 359,519 l -3,12 M 421,304 l -3,12 M 484,439 l -3,12 M 334,307 l -3,12 M 425,564 l -3,12 M 443,302 l -3,12 M 446,276 l -3,12 M 349,455 l -3,12 M 302,386 l -3,12 M 485,352 l -3,12 M 304,262 l -3,12 M 427,214 l -3,12 M 409,236 l -3,12 M 499,528 l -3,12 M 464,375 l -3,12 M 425,442 l -3,12 M 374,501 l -3,12 M 451,239 l -3,12 M 399,489 l -3,12 M 438,328 l -3,12 M 487,385 l -3,12 M 499,533 l -3,12 M 399,260 l -3,12 M 329,318 l -3,12 M 399,460 l -3,12 M 305,235 l -3,12 M 463,331 l -3,12 M 337,543 l -3,12 M 436,461 l -3,12 M 328,398 l -3,12 M 367,316 l -3,12 M 464,365 l -3,12 M 390,258 l -3,12 M 472,563 l -3,12 M 475,499 l -3,12"/></g>
  <g class="fl-rain fl-rain-3" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" fill="none"><path d="M 420,412 l -3,12 M 360,243 l -3,12 M 516,605 l -3,12 M 300,420 l -3,12 M 476,384 l -3,12 M 351,391 l -3,12 M 342,333 l -3,12 M 373,550 l -3,12 M 393,575 l -3,12 M 345,522 l -3,12 M 348,253 l -3,12 M 388,433 l -3,12 M 384,252 l -3,12 M 483,329 l -3,12 M 500,246 l -3,12 M 308,326 l -3,12 M 390,356 l -3,12 M 328,279 l -3,12 M 504,506 l -3,12 M 312,377 l -3,12 M 469,310 l -3,12 M 345,233 l -3,12 M 327,578 l -3,12 M 373,277 l -3,12 M 439,604 l -3,12 M 482,212 l -3,12 M 452,401 l -3,12 M 495,505 l -3,12 M 440,348 l -3,12 M 418,556 l -3,12 M 428,238 l -3,12 M 419,504 l -3,12 M 420,217 l -3,12 M 497,455 l -3,12 M 331,287 l -3,12 M 436,338 l -3,12 M 372,563 l -3,12 M 484,546 l -3,12 M 350,388 l -3,12 M 473,333 l -3,12 M 288,560 l -3,12 M 327,213 l -3,12 M 306,262 l -3,12 M 510,534 l -3,12 M 394,209 l -3,12 M 405,489 l -3,12 M 299,574 l -3,12 M 495,460 l -3,12 M 391,589 l -3,12 M 450,466 l -3,12"/></g>

  <g class="fl-hud">
    <g stroke="#38BDF8" stroke-width="1.5" fill="none">
      <circle cx="400" cy="600" r="50" stroke-dasharray="6 6"/>
      <circle cx="400" cy="600" r="20" opacity="0.6"/>
      <circle cx="400" cy="600" r="3" fill="#38BDF8"/>
      <path d="M 340,600 L 355,600"/><path d="M 460,600 L 445,600"/>
      <path d="M 400,540 L 400,555"/><path d="M 400,660 L 400,645"/>
    </g>
    <circle cx="400" cy="600" r="68" fill="none" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="16 32" opacity="0.6"/>
    <g font-family="monospace" font-size="7" font-weight="bold" fill="#38BDF8">
      <text x="475" y="576">LAT: 44.44 N</text>
      <text x="475" y="588">LON: 18.15 E</text>
      <text x="475" y="600">FORECAST: 7 DAYS</text>
      <text x="475" y="612" fill="#2DD4BF">MODEL: GLOFAS</text>
    </g>
  </g>

  <g class="fl-cloud">
    <circle cx="-30" cy="2" r="22" fill="#E2E8F0"/>
    <circle cx="2" cy="-12" r="32" fill="#E2E8F0"/>
    <circle cx="36" cy="0" r="24" fill="#E2E8F0"/>
    <rect x="-52" y="2" width="112" height="24" rx="12" fill="#E2E8F0"/>
    <path d="M -52,14 H 60 a12,12 0 0 1 -12,12 H -40 a12,12 0 0 1 -12,-12 Z" fill="#94A3B8" opacity="0.55"/>
  </g>

  <g transform="translate(400, 700)" text-anchor="middle">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="34"
      font-weight="900" fill="#FFFFFF" letter-spacing="2" stroke="#020617" stroke-width="7" stroke-linejoin="round" paint-order="stroke">FLOOD<tspan fill="#38BDF8">WATCH</tspan></text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15"
      font-weight="700" fill="#7DD3FC" letter-spacing="4" stroke="#020617" stroke-width="5" stroke-linejoin="round" paint-order="stroke">BOSNIA &amp; HERZEGOVINA</text>
  </g>
</svg>
