<?xml version="1.0" encoding="UTF-8"?>
<!-- FloodWatch loading screen: a satellite fading in above a curved horizon, scanning a river valley with a
     beam while a HUD reticle locks on and the water rises. Self-contained (no external assets): open it
     directly in a browser to preview it. floodwatch/mapgen.py reads this file and splices its <svg>...</svg>
     into the page's loading overlay (see _splash_svg() and the __SPLASH_SVG__ placeholder), so this is the
     only copy to edit. This comment and the XML prolog are removed before splicing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1200 0 3200 800" width="100%" height="100%"
  preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="flSpaceBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="flEarthGrad" cx="50%" cy="1400" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="75%" stop-color="#1E3A8A"/>
      <stop offset="98%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="flSolar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="flLand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="flWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="flBeamFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="flDome"><path d="M -400,1400 A 800,800 0 0,1 1200,1400 Z"/></clipPath>
    <style>
      /* The first part (satellite, beam, HUD, rising water) plays once over 3 s and holds its last frame.
         Only the small ambient loops (ripples, rain) repeat. Animated properties are limited to opacity
         and transform on small groups; the planet is static. */
      @keyframes flRise {
        0%, 35% { transform: scale(1); }
        55%, 100% { transform: scale(1.35); }
      }
      .fl-rise {
        animation: flRise 3s ease-out 1 forwards;
        transform-origin: 400px 640px;
      }
      @keyframes flFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      .fl-satellite {
        transform: translate(400px, 170px);
        opacity: 0;
        animation: flFadeIn .6s ease-out .15s 1 forwards;
      }
      .fl-beam { animation: flFadeIn 1.6s ease-out 1.0s 1 both; }
      @keyframes flHud {
        0%, 55% { opacity: 0; transform: scale(0.6); }
        80%, 100% { opacity: 1; transform: scale(1); }
      }
      .fl-hud {
        animation: flHud 3s cubic-bezier(0.175, 0.885, 0.32, 1.2) 1 forwards;
        transform-origin: 400px 600px;
      }
      @keyframes flRipple {
        0% { transform: scale(0.3); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .fl-ripple-1 { animation: flRipple 1.8s ease-out infinite; transform-origin: 400px 618px; }
      .fl-ripple-2 { animation: flRipple 1.8s ease-out infinite .9s; transform-origin: 400px 618px; }
      @keyframes flRain {
        0% { opacity: 0; transform: translate(0, -20px); }
        25% { opacity: 0.35; }
        100% { opacity: 0; transform: translate(-10px, 40px); }
      }
      .fl-rain { animation: flRain 1.2s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fl-rise, .fl-satellite, .fl-beam, .fl-hud, .fl-ripple-1, .fl-ripple-2, .fl-rain { animation: none; }
        .fl-satellite, .fl-beam, .fl-hud { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="-1200" width="3200" height="800" fill="url(#flSpaceBg)"/>

  <g>
    <!-- The planet: a fill that closes the bottom corners (same circle as the horizon arc below) and the arc itself. -->
    <path d="M 0,800 L 0,707.2 A 800,800 0 0,1 800,707.2 L 800,800 Z" fill="url(#flEarthGrad)"/>
    <path d="M -400,1400 A 800,800 0 0,1 1200,1400 Z" fill="url(#flEarthGrad)" stroke="#1D4ED8" stroke-width="2.5"/>

    <!-- A river valley on the planet, clipped to the planet's disc. -->
    <g clip-path="url(#flDome)">
      <ellipse cx="400" cy="745" rx="430" ry="128" fill="url(#flLand)"/>
      <ellipse cx="270" cy="652" rx="95" ry="18" fill="#065F46" opacity="0.7"/>
      <ellipse cx="545" cy="650" rx="100" ry="17" fill="#065F46" opacity="0.7"/>
      <!-- The river, widening toward the viewer. -->
      <path d="M 399,601 C 392,620 380,630 388,648 C 396,666 430,676 410,700 C 392,722 350,740 360,770 L 340,800 L 470,800 C 455,770 470,745 450,720 C 432,696 446,676 424,654 C 406,636 416,622 402,601 Z"
        fill="url(#flWater)" stroke="#BAE6FD" stroke-width="1.2" stroke-opacity="0.6"/>
      <!-- Houses along the banks, lit. -->
      <g fill="#FBBF24" opacity="0.9">
        <rect x="334" y="652" width="7" height="5"/><rect x="348" y="644" width="6" height="5"/>
        <rect x="452" y="650" width="7" height="5"/><rect x="466" y="660" width="6" height="5"/>
        <rect x="318" y="684" width="8" height="6"/><rect x="486" y="692" width="8" height="6"/>
        <rect x="300" y="668" width="6" height="5"/><rect x="505" y="672" width="6" height="5"/>
      </g>
    </g>

    <!-- The rising water: a flood plain spreading around the river. Only this small group is scaled. -->
    <g class="fl-rise">
      <ellipse cx="400" cy="642" rx="70" ry="11" fill="#38BDF8" opacity="0.28"/>
      <ellipse cx="400" cy="642" rx="40" ry="6" fill="#7DD3FC" opacity="0.25"/>
    </g>
    <ellipse class="fl-ripple-1" cx="400" cy="618" rx="46" ry="8" fill="none" stroke="#7DD3FC" stroke-width="1.5"/>
    <ellipse class="fl-ripple-2" cx="400" cy="618" rx="46" ry="8" fill="none" stroke="#7DD3FC" stroke-width="1.5"/>
  </g>

  <!-- Rain in the sky beside the beam. -->
  <g class="fl-rain" stroke="#7DD3FC" stroke-width="1.4" stroke-linecap="round">
    <path d="M 250,300 l -4,12"/><path d="M 290,360 l -4,12"/><path d="M 330,280 l -4,12"/><path d="M 210,420 l -4,12"/>
    <path d="M 470,310 l -4,12"/><path d="M 510,370 l -4,12"/><path d="M 550,290 l -4,12"/><path d="M 590,430 l -4,12"/>
  </g>

  <g class="fl-hud">
    <g stroke="#38BDF8" stroke-width="1.5" fill="none">
      <circle cx="400" cy="600" r="50" stroke-dasharray="6 6"/>
      <circle cx="400" cy="600" r="20" opacity="0.6"/>
      <circle cx="400" cy="600" r="3" fill="#38BDF8"/>
      <path d="M 340,600 L 355,600"/><path d="M 460,600 L 445,600"/>
      <path d="M 400,540 L 400,555"/><path d="M 400,660 L 400,645"/>
    </g>
    <circle cx="400" cy="600" r="68" fill="none" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="16 32" opacity="0.6"/>
    <g font-family="monospace" font-size="7" font-weight="bold" fill="#38BDF8">
      <text x="475" y="564">LAT: 44.44 N</text>
      <text x="475" y="576">LON: 18.15 E</text>
      <text x="475" y="588">FORECAST: 7 DAYS</text>
      <text x="475" y="600" fill="#2DD4BF">STATUS: MONITORING</text>
    </g>
  </g>

  <!-- The beam is fixed at the satellite's resting point (400,170); it only appears after the satellite has arrived. -->
  <polygon class="fl-beam" transform="translate(400, 170)" points="0,0 -140,430 140,430" fill="url(#flBeamFade)"/>

  <g class="fl-satellite">
    <rect x="-110" y="-10" width="65" height="20" rx="2" fill="url(#flSolar)" stroke="#334155" stroke-width="1"/>
    <line x1="-45" y1="0" x2="-20" y2="0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="45" y="-10" width="65" height="20" rx="2" fill="url(#flSolar)" stroke="#334155" stroke-width="1"/>
    <line x1="20" y1="0" x2="45" y2="0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="-20" y="-16" width="40" height="32" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#1E293B"/>
    <path d="M -12,16 Q 0,26 12,16 Z" fill="#94A3B8"/>
    <circle cx="0" cy="24" r="2.5" fill="#38BDF8"/>
  </g>

  <g transform="translate(400, 700)" text-anchor="middle">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="34"
      font-weight="900" fill="#FFFFFF" letter-spacing="2" stroke="#020617" stroke-width="7" stroke-linejoin="round" paint-order="stroke">FLOOD<tspan fill="#38BDF8">WATCH</tspan></text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15"
      font-weight="700" fill="#7DD3FC" letter-spacing="4" stroke="#020617" stroke-width="5" stroke-linejoin="round" paint-order="stroke">BOSNIA &amp; HERZEGOVINA</text>
  </g>
</svg>
